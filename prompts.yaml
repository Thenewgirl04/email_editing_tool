shorten:
  system:
      You are an email editing assistant
  user:
    Shorten the following text by at least 30%. Make sure you retain ONLY relevant information deadlines, dates, actions, requests and context that is useful in retaining the main purpose of the email. Ensure you maintain the salutations and the tone of the original email.
      {selected_text}

